<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Schedule board</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--red:#b91c1c;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--card:#fff;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.brand{color:var(--red);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:14px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}
.sub{color:var(--muted);font-size:15px}
.opt{border:2px solid var(--line);border-radius:10px;padding:12px 12px 10px;margin:16px 0 10px;position:relative}
.opt.r1{border-color:#047857}.opt.r2{border-color:#2563eb}.opt.r3{border-color:#7c3aed}
.rank{position:absolute;top:-13px;left:12px;background:#fff;padding:0 8px;font-weight:800;font-size:14px}
.r1 .rank{color:#047857}.r2 .rank{color:#2563eb}.r3 .rank{color:#7c3aed}
.opt .when{font-size:18px;font-weight:700;margin-top:2px}
.fit{float:right;font-weight:700;font-size:13px;border:2px solid;border-radius:999px;padding:1px 10px;letter-spacing:.5px;margin-left:8px}
.opt ul{margin:6px 0 0 18px;padding:0}.flag{color:#b45309;font-weight:600}
.jobs{margin-top:8px;font-size:14px;color:#374151}.jobs div{padding:2px 0;border-top:1px dashed var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
th{background:#f9fafb;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td.we{background:#fafafa;color:#9ca3af}.chip{display:block;padding:3px 0;border-bottom:1px dashed var(--line)}.chip:last-child{border-bottom:0}
.chip b{font-weight:600}.mi{color:var(--muted);font-size:12px}.best{background:#ecfdf5!important}
.rk{display:inline-block;border:2px solid;border-radius:999px;padding:0 7px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:1px}
.rk1{color:#047857;border-color:#047857}.rk2{color:#2563eb;border-color:#2563eb}.rk3{color:#7c3aed;border-color:#7c3aed}
.load{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
#map{height:440px;border-radius:8px;border:1px solid var(--line)}
.legend span{display:inline-block;margin-right:12px;font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.grid{overflow-x:auto}.foot{color:#9ca3af;font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.form label{font-size:13px;color:var(--muted);display:block}.form input,.form select,.form textarea{width:100%;font-size:16px;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-family:inherit}
.form .full{grid-column:1/-1}.btn{font-size:16px;padding:10px 16px;border-radius:8px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.queue td{font-size:14px}.queue .plan{font-size:13px;padding:4px 10px;border-radius:6px;border:2px solid #2563eb;background:#fff;color:#2563eb;font-weight:700;cursor:pointer}
.note{font-size:13px;color:var(--muted);margin-top:6px}
@media(max-width:640px){.wrap{padding:6px}.card{padding:12px}h1{font-size:19px}}

#gate{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #e5e7eb;border-top:8px solid #b91c1c;border-radius:10px;padding:24px;text-align:center}
#gate input{font-size:26px;letter-spacing:10px;text-align:center;width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;margin:12px 0}
#gate button{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#b91c1c;color:#fff;font-weight:700;width:100%}
#err{color:#b91c1c;min-height:22px;font-size:14px}
</style></head><body>
<div id="gate"><div class="brand">Ace Fire Protection</div><div style="font-size:18px;font-weight:700;margin-top:6px">Schedule board</div>
<div class="sub">Enter the access code</div>
<form id="f"><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="••••" autofocus><div id="err"></div>
<button type="submit">Open</button></form>
<label class="sub" style="display:block;margin-top:10px;font-size:13px"><input type="checkbox" id="remember" checked> remember on this device</label></div>
<div id="content"></div>

var RANKC={1:'#047857',2:'#2563eb',3:'#7c3aed'};
function mkMap(center){
  var map=L.map('map',{scrollWheelZoom:false}).setView(center,11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  return map;
}
function fitAll(map,bounds){function fit(){map.invalidateSize();if(bounds.length>1)map.fitBounds(bounds,{padding:[30,30],maxZoom:12});}fit();setTimeout(fit,250);setTimeout(fit,1000);}
function initPlanMap(data){
  var map=mkMap([data.job.lat,data.job.lon]);var bounds=[[data.job.lat,data.job.lon]];
  L.circleMarker([data.job.lat,data.job.lon],{radius:11,color:'#b91c1c',fillColor:'#b91c1c',fillOpacity:.9,weight:3}).addTo(map)
    .bindPopup('<b>NEW JOB</b><br>'+data.job.label+'<br>'+data.job.address).openPopup();
  L.circleMarker([data.shop.lat,data.shop.lon],{radius:6,color:'#111827',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(map).bindPopup('Shop');
  data.jobs.forEach(function(j){ if(j.lat==null)return; var c=j.rank?RANKC[j.rank]:'#9ca3af';
    L.circleMarker([j.lat,j.lon],{radius:j.rank?8:5,color:c,fillColor:c,fillOpacity:.85,weight:j.rank?3:1}).addTo(map)
      .bindPopup('<b>'+j.day+'</b> '+j.time+'<br>'+j.customer+'<br>'+j.address+'<br>'+j.techs+' · '+j.type+(j.q?' · '+j.q:'')+'<br>'+(j.drive||''));
    bounds.push([j.lat,j.lon]); });
  fitAll(map,bounds);
}
function initBoard(data){
  var map=mkMap([data.shop.lat,data.shop.lon]);var bounds=[[data.shop.lat,data.shop.lon]];
  L.circleMarker([data.shop.lat,data.shop.lon],{radius:6,color:'#111827',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(map).bindPopup('Shop');
  data.jobs.forEach(function(j){ if(j.lat==null)return;
    L.circleMarker([j.lat,j.lon],{radius:6,color:j.color,fillColor:j.color,fillOpacity:.85,weight:2}).addTo(map)
      .bindPopup('<b>'+j.day+'</b> '+j.time+'<br>'+j.customer+'<br>'+j.address+'<br>'+j.techs+' · '+j.type+(j.q?' · '+j.q:''));
    bounds.push([j.lat,j.lon]); });
  fitAll(map,bounds);
  setupForm(data); setupQueue(data);
}
function $(id){return document.getElementById(id);}
function buildRequest(){
  var p=[]; var q=$('f_q').value.trim(), c=$('f_customer').value.trim(), a=$('f_address').value.trim();
  p.push('Plan a job:'+(q?' '+q:'')+(c?' · '+c:''));
  p.push('Address: '+a);
  p.push($('f_system').value+' · '+$('f_kind').value+' · '+$('f_duration').value+'h');
  if($('f_start').value)p.push('Earliest: '+$('f_start').value);
  if($('f_urgent').checked)p.push('URGENT');
  if($('f_notes').value.trim())p.push('Notes: '+$('f_notes').value.trim());
  return p.join('\n');
}
function setupForm(data){
  $('f_send').onclick=async function(){
    if(!$('f_address').value.trim()){$('f_msg').textContent='Address is required.';return;}
    var text=buildRequest();
    try{ await navigator.clipboard.writeText(text);}catch(e){}
    if(navigator.share){ try{ await navigator.share({text:text}); $('f_msg').textContent='Sent — Claude will reply in Telegram with the ranked options and the plan link.'; return;}catch(e){} }
    window.open(data.telegram,'_blank'); $('f_msg').textContent='Request copied to the clipboard — paste it into the Telegram chat that just opened.';
  };
  $('f_copy').onclick=async function(){ try{await navigator.clipboard.writeText(buildRequest()); $('f_msg').textContent='Copied.';}catch(e){$('f_msg').textContent=buildRequest();} };
}
/* ---- to-schedule queue from the Wix quotes sheet (browser-side, same OAuth client as the dashboard) ---- */
var gToken=null, tokenClient=null;
function setupQueue(data){
  $('q_load').onclick=function(){
    if(!window.google||!google.accounts){$('q_msg').textContent='Google sign-in did not load — reload the page.';return;}
    if(!tokenClient){ tokenClient=google.accounts.oauth2.initTokenClient({client_id:data.sheet.clientId,scope:'https://www.googleapis.com/auth/spreadsheets',
      callback:function(resp){ if(resp.error){$('q_msg').textContent='Sign-in cancelled.';return;} gToken=resp.access_token; loadQueue(data); }}); }
    tokenClient.requestAccessToken({prompt:''});
  };
}
async function gGet(url){var r=await fetch(url,{headers:{Authorization:'Bearer '+gToken}}); if(!r.ok)throw new Error('Sheets '+r.status); return r.json();}
async function loadQueue(data){
  $('q_msg').textContent='Loading…';
  try{
    var API='https://sheets.googleapis.com/v4/spreadsheets/'+data.sheet.id;
    var meta=await gGet(API+'?fields=sheets.properties.title'); var titles=(meta.sheets||[]).map(function(s){return s.properties.title;});
    var tab=titles.find(function(t){return t.toLowerCase()===data.sheet.tab.toLowerCase();})||titles.find(function(t){return t.toLowerCase().indexOf('accept')>=0;});
    var res=await gGet(API+'/values/'+encodeURIComponent(tab+'!A1:AB')+'?majorDimension=ROWS'); var v=res.values||[];
    var rows=[];
    for(var i=1;i<v.length;i++){var r=v[i]||[]; var g=function(k){return (k<r.length&&r[k]!=null)?String(r[k]).trim():'';};
      var quote=g(0).replace(/[,\s]/g,''), name=g(1), title=g(4), emberDate=g(12), jobStatus=g(19), status=g(7);
      if(!quote&&!name)continue; if(emberDate)continue;
      if(/cancel|closed|done|complete|lost|declin/i.test(jobStatus+' '+status))continue;
      var ci=name.indexOf(','); var client=ci>=0?name.slice(0,ci).trim():name;
      var ai=title.toLowerCase().indexOf(' at '); var service=ai>=0?title.slice(0,ai).trim():title; var site=ai>=0?title.slice(ai+4).trim():'';
      rows.push({quote:quote,client:client,service:service,site:site,amount:g(6),status:status,jobStatus:jobStatus,row:i+1});}
    var tb=$('q_table'); tb.innerHTML='';
    if(!rows.length){$('q_msg').textContent='Nothing waiting — every accepted quote has an Ember date.';return;}
    rows.forEach(function(x){var tr=document.createElement('tr'); var qn=x.quote?('Q'+x.quote.replace(/^Q/i,'')):'';
      tr.innerHTML='<td><b>'+escH(qn)+'</b></td><td>'+escH(x.client)+'</td><td>'+escH(x.site||x.service)+'<div class=mi>'+escH(x.service)+'</div></td><td>'+escH(x.amount)+'</td><td>'+escH(x.status)+(x.jobStatus?' · '+escH(x.jobStatus):'')+'</td><td><button class=plan>Plan</button></td>';
      tr.querySelector('button').onclick=function(){$('f_q').value=qn; $('f_customer').value=x.client; $('f_address').value=x.site; guessSystem(x.service); $('f_address').scrollIntoView({behavior:'smooth',block:'center'}); $('f_msg').textContent='Filled from the quote — check the address, then Send.';};
      tb.appendChild(tr);});
    $('q_msg').textContent=rows.length+' accepted quote(s) without an Ember date.';
  }catch(e){$('q_msg').textContent='Could not load the sheet: '+e.message;}
}
function guessSystem(s){var t=s.toLowerCase(), sel=$('f_system'); var pick='';
  if(/pump/.test(t))pick='Fire pump'; else if(/alarm/.test(t))pick='Fire alarm'; else if(/dry/.test(t))pick='Dry Pipe Sprinkler'; else if(/sprinkler/.test(t))pick='Wet Pipe Sprinkler'; else if(/extinguisher/.test(t))pick='Fire extinguishers'; else if(/exit|emergency light/.test(t))pick='Exit signs and emergency lights'; else if(/backflow/.test(t))pick='Backflow'; else if(/hood/.test(t))pick='Kitchen hood'; else if(/standpipe/.test(t))pick='Standpipe';
  if(pick)sel.value=pick; var k=$('f_kind'); if(/repair|replace|relocat|fix/.test(t))k.value='Repair'; else if(/install|new system/.test(t))k.value='Install'; else if(/inspection|test|annual|quarterly|monthly|5.year|certif/.test(t))k.value='Inspection';}
function escH(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function initPage(data){ if(data.mode==='board')initBoard(data); else initPlanMap(data); }

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function tryOpen(code){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function openPage(code,remember){
  try{
    var html=await tryOpen(code);
    if(remember)localStorage.setItem('acePlansCode',code);
    document.getElementById('gate').style.display='none';
    var c=document.getElementById('content');c.innerHTML=html;
    var d=document.getElementById('plan-data');if(d){initPage(JSON.parse(d.textContent));}
    return true;
  }catch(e){console.error(e);return false;}
}
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();
  var ok=await openPage(document.getElementById('code').value.trim(),document.getElementById('remember').checked);
  if(!ok){document.getElementById('err').textContent='Wrong code';document.getElementById('code').value='';}
});
(async function(){var s=localStorage.getItem('acePlansCode');if(s){var ok=await openPage(s,true);if(!ok)localStorage.removeItem('acePlansCode');}})();
</script></body></html>
